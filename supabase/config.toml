# Supabase Configuration for MealScanner Mobile

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[auth]
enabled = true
site_url = "exp://localhost:8081"
additional_redirect_urls = ["https://your-app.com"]
jwt_expiry = 3600
enable_signup = true
enable_email_confirmations = false
enable_email_autoconfirm = true

[edge_functions]
enabled = true
verify_jwt = false

[[edge_functions.env_vars]]
name = "SUPABASE_URL"
value = "http://localhost:54321"

[[edge_functions.env_vars]]
name = "SUPABASE_SERVICE_ROLE_KEY"
value = "YOUR_SERVICE_ROLE_KEY_HERE"

[[edge_functions.env_vars]]
name = "OPENAI_API_KEY"
value = "YOUR_OPENAI_API_KEY_HERE"

[storage]
enabled = true
file_size_limit = "50MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
bucket_defaults = { public = false }

[analytics]
enabled = false 